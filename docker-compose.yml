version: '3.8'

services:
  backend:
    build:
      context: ./backend2
      dockerfile: Dockerfile
    image: kezara666/gscomp311:latest  # Explicitly set the image name
    ports:
      - "5000:5000"
  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend2:/usr/share/nginx/html:ro
    ports:
      - "3000:80"